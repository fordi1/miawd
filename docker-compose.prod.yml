# Production stack: database + app + HTTPS front door + backups.
#   cp deploy/env.production.example .env.production   (then fill it in, or let deploy/setup.sh do it)
#   docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build
# keep container logs from filling the disk (3 files of 10 MB per service)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: mawid
      POSTGRES_USER: mawid
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.production}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mawid -d mawid"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://mawid:${DB_PASSWORD}@db:5432/mawid
      API_KEY_PEPPER: ${API_KEY_PEPPER:?set API_KEY_PEPPER in .env.production}
      SLOT_TOKEN_SECRET: ${SLOT_TOKEN_SECRET:?set SLOT_TOKEN_SECRET in .env.production}
      PUBLIC_URL: ${PUBLIC_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: "true"
      PORT: "3000"
    # apply database migrations, then start
    command: ["sh", "-c", "node dist/db/migrate.js && node dist/server.js"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      - app
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: mawid
      PGDATABASE: mawid
      PGPASSWORD: ${DB_PASSWORD}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - backups:/backups
    entrypoint: ["sh", "/backup.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:
